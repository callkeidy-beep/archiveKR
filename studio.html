<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>archiveKR 체험용 제작실</title>
<style>@font-face{font-family:ArchiveHead;src:url(./fonts/head.ttf)}@font-face{font-family:ArchiveBody;src:url(./fonts/body.ttf)}body{font:16px system-ui;background:#f5f4ef;color:#183a36;margin:0;padding:24px}main{max-width:900px;margin:auto}label{display:block;margin:18px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #aab9b3;border-radius:6px}button{padding:12px;border:0;border-radius:6px;background:#183a36;color:white;cursor:pointer;margin:5px}canvas{max-width:100%;width:420px;height:auto;border-radius:10px}aside{background:#fff0ba;padding:15px}#status{min-height:24px}</style>
<main><aside>체험용 제작실 · archiveKR 통제 · 최종 MOVIST 규격 1080×1440 · 브라우저 규칙 기반 편집 · 실제 MOVIST 수집, AI 생성, SNS 게시 없음.<br>데스크에서 원고를 넘겨받아 수정하고 다시 등록하면 새 제작 버전의 승인이 필요합니다.</aside><h1>영화·카드뉴스 제작실</h1><label>제목<input id="title" value="[체험원고] 나만의 영화 카드"></label><label>원고 본문<textarea id="body" rows="7">체험용 원고를 입력해 텍스트 카드와 SNS 문안을 만들어 보세요.</textarea></label><label>Instagram 문안<textarea id="caption" rows="5"></textarea></label><label>Threads 문안<textarea id="threads" rows="4"></textarea></label><label>카카오용 문안<textarea id="kakao" rows="4"></textarea></label><button id="generate">규칙으로 문안·카드 만들기</button><button id="save">원고를 데스크에 등록</button><button id="download">카드 PNG 다운로드</button><p id="status" role="status"></p><canvas id="card" width="1080" height="1440"></canvas><p>문안은 원고 앞부분을 발췌합니다. 직접 수정한 SNS 문안은 이 제작실 체험에만 남고, 데스크 등록은 제목·본문을 기준으로 새 문안을 만듭니다.</p></main>
<script src="./card-renderer.js"></script>
<script>
(()=>{const $=s=>document.getElementById(s);let article=null;const send=data=>parent.postMessage(data,location.origin);function draw(){window.archiveKRDrawCard($('card'),$('title').value);}function generate(){$('caption').value=$('title').value+'\n\n'+$('body').value.slice(0,800)+'\n\n#archiveKR #체험원고';$('kakao').value=$('title').value+'\n\n'+$('body').value.slice(0,500);$('threads').value=$('title').value+'\n\n'+$('body').value.slice(0,350);draw();} $('generate').onclick=generate;$('title').oninput=draw;$('download').onclick=()=>{draw();const a=document.createElement('a');a.download='archiveKR-demo-card.png';a.href=$('card').toDataURL('image/png');a.click();};$('save').onclick=async()=>{if(!$('title').value.trim()||!$('body').value.trim()){$('status').textContent='제목과 본문을 입력하세요.';return;}try{const r=await parent.fetch('/api/desk/articles'+(article?.id?'/'+article.id:''),{method:article?.id?'PATCH':'POST',body:JSON.stringify({title:$('title').value,body:$('body').value,organization:'체험용 제작실',sourceUrl:article?.sourceUrl||''})});const d=await r.json();if(!r.ok)throw Error(d.error);article=d.item;$('status').textContent='브라우저의 데스크에 저장했습니다. 새 제작물은 자동화 화면에서 확인·승인하세요.';send({type:'archivekr:studio-registered',articleId:article.id});}catch(e){$('status').textContent=e.message;}};addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='archivekr:studio')return;const a=e.data.article;if(!a||typeof a.title!=='string'||typeof a.body!=='string')return;article=a;$('title').value=a.title;$('body').value=a.body;generate();$('caption').value=e.data.artifacts?.instagram||$('caption').value;$('threads').value=e.data.artifacts?.threads||$('threads').value;$('status').textContent='데스크 원고를 받았습니다. 수정 후 다시 등록할 수 있습니다.';send({type:'archivekr:studio-loaded'});});document.fonts.ready.then(generate);send({type:'archivekr:studio-ready'});})();
</script></html>
